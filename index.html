/* v12: giao diện tối giản, vùng chơi chiếm tối đa màn hình. */
html,body{width:100%;height:100%;overflow:hidden}
body{padding:0;display:block;background:#fff}

.header{flex:0 0 auto;padding:8px 16px;min-height:57px;gap:8px}

let state,toastTimer,travelTimer;
function initial(){return {side:'left',bank:['left','left','left'],aboard:[],moves:0,sailing:false,finished:false}}
function total(){return state.aboard.reduce((n,i)=>n+characters[i].kg,0)}
function notice(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function reset(){stopVictory();clearTimeout(travelTimer);clearTimeout(toastTimer);state=initial();$('#toast').classList.remove('show');$('#modal').classList.remove('show');render()}
function choose(i){if(state.sailing||state.finished)return;startAudio();const index=state.aboard.indexOf(i);if(index>=0){sfx("unboard");state.aboard.splice(index,1);state.bank[i]=state.side}else if(state.bank[i]===state.side){if(state.aboard.length>=2){sfx("invalid");notice('Thuyền chỉ có 2 chỗ ngồi!');return}sfx("board");state.aboard.push(i)}else{return}render();if(total()>100){sfx("overload");notice('Quá tải! Hãy cho một bạn xuống thuyền.')}}
function personNode(i,sit,slot){const d=document.createElement('div');d.className=sit?'seat '+(state.aboard.length===1?'solo':'slot'+slot)+(characters[i].kg===52?' char-52':''):'person';d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-disabled',String(state.sailing||state.finished));d.setAttribute('aria-label',`${characters[i].name}, ${characters[i].kg} kg. ${sit?'Xuống thuyền':'Lên thuyền'}`);d.title=sit?'Nhấn để xuống thuyền':'Nhấn để lên thuyền';const pic=document.createElement('img');pic.src=sit?characters[i].sitting:characters[i].standing;pic.alt=characters[i].name;pic.draggable=false;const weight=document.createElement('span');weight.className='weight';weight.textContent=characters[i].kg+' kg';d.append(pic,weight);d.addEventListener('click',()=>choose(i));d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i)}});return d}
function render(){const bankL=$('#leftBank'),bankR=$('#rightBank'),seats=$('#seats');bankL.replaceChildren();bankR.replaceChildren();seats.replaceChildren();state.bank.forEach((side,i)=>{if(!state.aboard.includes(i)){(side==='right'?bankR:bankL).appendChild(personNode(i,false))}});state.aboard.forEach((i,k)=>seats.appendChild(personNode(i,true,k)));const boat=$('#boat'),over=total()>100;boat.classList.toggle('at-left',state.side==='left');boat.classList.toggle('sailing',state.sailing);boat.classList.toggle('over',over);const k=total();$('#go').disabled=state.sailing||state.finished||k===0||over;$('#go').textContent=state.side==='left'?'Qua sông →':'Quay lại ←';$('#trip').textContent='Lượt: '+state.moves;$('#status').textContent=state.sailing?'Thuyền đang di chuyển...':over?'Thuyền phát sáng đỏ vì quá tải, không thể di chuyển.':state.finished?'Đã đưa cả ba bạn qua sông!':`Thuyền đang ở bờ ${state.side==='right'?'phải':'trái'}. ${state.bank.filter(v=>v==='right').length} / 3 người đã ở bờ phải.`}
function cross(){if(state.sailing||state.finished)return;startAudio();if(total()===0){notice('Cần ít nhất một người chèo thuyền!');return}if(total()>100){notice('Quá tải! Không thể qua sông.');return}sfx("sail");state.sailing=true;state.side=state.side==='right'?'left':'right';state.moves++;render();travelTimer=setTimeout(()=>{state.sailing=false;sfx("arrive");render();if(state.bank.every((s,i)=>s==='right'||state.aboard.includes(i)&&state.side==='right')){ // require unloading to win
 if(state.aboard.length)notice('Đã tới bờ! Nhấn vào các bạn để xuống thuyền.');
}},2700)}
function checkWin(){if(!state.sailing&&!state.finished&&state.bank.every(s=>s==='right')&&state.aboard.length===0){state.finished=true;$('#winText').textContent=`Bạn đã đưa cả 3 người sang bờ phải sau ${state.moves} lượt di chuyển.`;$('#modal').classList.add('show');playVictory();render()}}
const oldChoose=choose;choose=function(i){oldChoose(i);checkWin()};
$('#go').addEventListener('click',cross);$('#reset').addEventListener('click',reset);

// Fullscreen API: nút hoạt động khi mở file HTML trực tiếp bằng trình duyệt.
const fullBtn=document.getElementById('fullscreen');
const fullRoot=document.querySelector('.shell');
function syncFullscreen(){
 const active=document.fullscreenElement===fullRoot || document.webkitFullscreenElement===fullRoot;
 fullBtn.textContent=active?'⤡':'⛶';
 fullBtn.title=active?'Thoát toàn màn hình':'Toàn màn hình';
 fullBtn.setAttribute('aria-pressed',String(active));
 fullBtn.setAttribute('aria-label',active?'Thoát chế độ toàn màn hình':'Bật chế độ toàn màn hình');
}
fullBtn.addEventListener('click',async()=>{
 try {
  if(document.fullscreenElement||document.webkitFullscreenElement){
   if(document.exitFullscreen)await document.exitFullscreen();
   else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else if(fullRoot.requestFullscreen){await fullRoot.requestFullscreen();}
  else if(fullRoot.webkitRequestFullscreen){fullRoot.webkitRequestFullscreen();}
  else notice('Trình duyệt không hỗ trợ chế độ toàn màn hình. Bạn có thể nhấn F11 trên máy tính.');
 }catch(err){notice('Không thể bật toàn màn hình trên trình duyệt này. Thử phím F11.');}
 syncFullscreen();
});
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);

// Audio độc lập: Web Audio API, không tải tập tin âm thanh hay phụ thuộc Internet.
// Trình duyệt chỉ cho phép phát nhạc sau thao tác nhấn đầu tiên của người chơi.
let audioCtx=null, audioMaster=null, musicGain=null, sfxGain=null;
let audioEnabled=true, musicTimer=null, musicStep=0, victoryTimers=[];
const A4=440;
const noteHz=n=>A4*Math.pow(2,(n-69)/12);
function ensureAudio(){
 if(!audioEnabled)return false;
 try{
  if(!audioCtx){
   const Ctx=window.AudioContext||window.webkitAudioContext;
   if(!Ctx)return false;
   audioCtx=new Ctx();
   audioMaster=audioCtx.createGain();audioMaster.gain.value=1.64;
   musicGain=audioCtx.createGain();musicGain.gain.value=.35;
   sfxGain=audioCtx.createGain();sfxGain.gain.value=.85;
   musicGain.connect(audioMaster);sfxGain.connect(audioMaster);
   // Tăng biên độ tổng lên gấp đôi; limiter tránh méo tiếng ở đoạn âm lớn.
   const limiter=audioCtx.createDynamicsCompressor();
   limiter.threshold.value=-3;limiter.knee.value=0;limiter.ratio.value=20;
   limiter.attack.value=.003;limiter.release.value=.15;
   audioMaster.connect(limiter);limiter.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  return true;
 }catch(e){return false;}
}
function tone(midi,start,duration,volume=.2,wave='sine',target='music'){
 if(!audioEnabled||!audioCtx)return;
 const now=audioCtx.currentTime, t=Math.max(now+.008,start);
 const osc=audioCtx.createOscillator(),env=audioCtx.createGain();
 osc.type=wave;osc.frequency.setValueAtTime(noteHz(midi),t);
 env.gain.setValueAtTime(.0001,t);
 env.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.025);
 env.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(env);env.connect(target==='sfx'?sfxGain:musicGain);
 osc.start(t);osc.stop(t+duration+.04);
}
// Nhạc nền tự tạo: giai điệu dịu nhẹ, chủ đề phiêu lưu qua sông.
const bgNotes=[72,76,79,76,74,77,81,77,72,76,79,84,81,79,76,74,
  69,72,76,72,71,74,77,74,69,72,76,81,79,76,74,71];
const bgBass=[48,48,53,53,45,45,55,55];
function musicTick(){
 if(!audioEnabled||!audioCtx||document.hidden)return;
 const t=audioCtx.currentTime+.025;
 const n=bgNotes[musicStep%bgNotes.length];
 if(musicStep%2===0)tone(n,t,.32,.12,'sine');
 else tone(n,t,.20,.065,'triangle');
 if(musicStep%4===0){let bass=bgBass[Math.floor(musicStep/4)%bgBass.length];tone(bass,t,.95,.10,'triangle');tone(bass+12,t+.06,.65,.035,'sine');}
 musicStep++;
}
function startAudio(){
 if(!ensureAudio())return;
 if(!musicTimer){musicTick();musicTimer=setInterval(musicTick,350);}
}
function sfx(kind){
 if(!ensureAudio())return;
 const t=audioCtx.currentTime+.015;
 if(kind==='board'){tone(67,t,.15,.20,'sine','sfx');tone(74,t+.09,.17,.16,'triangle','sfx');}
 if(kind==='unboard'){tone(74,t,.14,.16,'triangle','sfx');tone(67,t+.10,.17,.13,'sine','sfx');}
 if(kind==='invalid'){tone(57,t,.16,.13,'sawtooth','sfx');}
 if(kind==='overload'){/* Warning: hai tiếng bíp cảnh báo rõ ràng */ tone(81,t,.19,.34,'square','sfx');tone(81,t+.27,.19,.34,'square','sfx');tone(76,t+.54,.28,.29,'square','sfx');}
 if(kind==='sail'){for(let k=0;k<4;k++)tone(60+k*2,t+k*.115,.2,.08,'sine','sfx');}
 if(kind==='arrive'){tone(72,t,.18,.12,'triangle','sfx');tone(79,t+.12,.27,.14,'sine','sfx');}
 if(kind==='hint'){tone(79,t,.11,.13,'sine','sfx');tone(83,t+.11,.14,.13,'sine','sfx');}
}
function stopVictory(){for(const id of victoryTimers)clearTimeout(id);victoryTimers=[];
 if(musicGain&&audioCtx)musicGain.gain.setTargetAtTime(.35,audioCtx.currentTime,.15);
}
function playVictory(){
 if(!ensureAudio())return;
 stopVictory();
 musicGain.gain.setTargetAtTime(.035,audioCtx.currentTime,.15);
 const melody=[72,76,79,84,81,84,88,91,88,84];
 const t=audioCtx.currentTime+.1;
 melody.forEach((n,i)=>{
  tone(n,t+i*.2,i===melody.length-1?.95:.3,.25,'triangle','sfx');
  if(i%2===0)tone(n-12,t+i*.2,.35,.10,'sine','sfx');
 });
 victoryTimers.push(setTimeout(()=>{if(musicGain&&audioCtx&&audioEnabled)musicGain.gain.setTargetAtTime(.35,audioCtx.currentTime,.6);victoryTimers=[];},3900));
}
function updateSoundButton(){
 const b=document.getElementById('soundToggle');
 b.textContent=audioEnabled?'♪ Âm thanh: Bật':'♫ Âm thanh: Tắt';b.dataset.sound=audioEnabled?'on':'off';
 b.setAttribute('aria-pressed',String(audioEnabled));
 b.setAttribute('aria-label',audioEnabled?'Tắt nhạc và hiệu ứng âm thanh':'Bật nhạc và hiệu ứng âm thanh');
}
document.getElementById('soundToggle').addEventListener('click',()=>{
 audioEnabled=!audioEnabled;
 if(audioEnabled){startAudio();sfx('board');}
 else{stopVictory();if(audioMaster&&audioCtx)audioMaster.gain.setValueAtTime(0,audioCtx.currentTime);
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
 if(audioEnabled&&audioMaster&&audioCtx)audioMaster.gain.setValueAtTime(1.64,audioCtx.currentTime);
 updateSoundButton();
});
// Nút khởi tạo nhạc sau tương tác đầu tiên, kể cả khi người chơi bấm toàn màn hình.
document.getElementById('fullscreen').addEventListener('click',startAudio);
document.getElementById('reset').addEventListener('click',startAudio);
document.addEventListener('visibilitychange',()=>{if(audioCtx){if(document.hidden)audioCtx.suspend();else if(audioEnabled)audioCtx.resume().catch(()=>{});}});
updateSoundButton();
reset(); // Khởi tạo sau khi toàn bộ biến và hàm âm thanh đã được khai báo.

</script></body></html>
